# Sandbox kit for the prebuilt local pi-sbx image, defaulting to Codex OAuth.
# host.docker.internal is mapped by sbx to the host's localhost, so the
# 127.0.0.1-bound Ollama is reachable; the egress policy sees that traffic as
# "localhost:11434" (both forms allowed below). Model/provider config is
# bundled under files/home/ and lands in /home/agent/.pi/agent/ at sandbox
# creation: models.json registers optional Ollama models, while settings.json
# selects GPT-5.6 Sol with high reasoning as the default.
schemaVersion: "2"
kind: sandbox
name: pi
displayName: Pi
description: Sandboxed pi coding agent using Codex OAuth with optional host Ollama models.

sandbox:
  image: "pi-sbx:local"
  entrypoint: [pi]

agentInstructions:
  filename: AGENTS.md

# OAuth is authorized once on the host with `sbx secret set openai --oauth`.
# Pi requires a real JWT locally to derive the ChatGPT account id, so this uses
# passthrough rather than the safer sentinel-only mode. The credential is copied
# into each VM, never mounted from the host, and remains inaccessible to other
# sandboxes and host paths.
credentials:
  - service: openai
    description: Optional ChatGPT Plus/Pro authentication for Pi's Codex provider
    oauth:
      tokenEndpoint:
        host: auth.openai.com
        path: /oauth/token
      sentinels:
        accessToken: oai-oat01-proxy-managed
        refreshToken: oai-ort01-proxy-managed
      credentialFile:
        path: "~/.pi/agent/auth.json"
        template: '{"openai-codex":{"type":"oauth","access":"{{.AccessToken}}","refresh":"{{.RefreshToken}}","expires":{{.ExpiresAt}}}}'
      resourceHosts:
        - chatgpt.com
      passthrough: true

permissions:
  network:
    # Global whitelist for all pi sandboxes. Curated: model backend, package
    # registries, pi's fd/rg helper downloads, docs, and search. Everything
    # else stays blocked by the deny-all global policy — extend deliberately.
    allow:
      # host Ollama (host.docker.internal is seen by the proxy as localhost)
      - "localhost:11434"
      - "host.docker.internal:11434"
      # Ubuntu apt mirrors (read-only; lets pi sudo apt-get install on its own)
      - "archive.ubuntu.com:80"
      - "archive.ubuntu.com:443"
      - "security.ubuntu.com:80"
      - "security.ubuntu.com:443"
      # package registries
      - "download.docker.com:443"
      - "registry.npmjs.org:443"
      - "pypi.org:443"
      - "files.pythonhosted.org:443"
      - "crates.io:443"
      - "index.crates.io:443"
      - "static.crates.io:443"
      - "proxy.golang.org:443"
      # GitHub (pi downloads fd/ripgrep from release assets)
      - "github.com:443"
      - "api.github.com:443"
      - "codeload.github.com:443"
      - "objects.githubusercontent.com:443"
      - "raw.githubusercontent.com:443"
      # OpenAI Codex subscription: OAuth login/refresh + model traffic
      - "auth.openai.com:443"
      - "chatgpt.com:443"
      # docs & search
      - "google.com:443"
      - "www.google.com:443"
      - "duckduckgo.com:443"
      - "html.duckduckgo.com:443"
      - "en.wikipedia.org:443"
      - "stackoverflow.com:443"
      - "developer.mozilla.org:443"
      - "docs.rs:443"
      - "doc.rust-lang.org:443"
      - "docs.python.org:443"
      - "nodejs.org:443"
      - "go.dev:443"

setup:
  install:
    - command: "bash ~/.pi/agent/scripts/reconcile-tools.sh"
      description: Activate image-baked dependencies and generate user-scoped skills
